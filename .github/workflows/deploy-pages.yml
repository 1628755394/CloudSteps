name: Deploy admin to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "admin/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# 部署 admin 后台到 GitHub Pages，用于 UI 预览（demo 模式，无后端）。
# 核心仓库 LingByte/CloudSteps 未启用 Pages，fork 仍可自行部署。
jobs:
  build:
    if: github.repository != 'LingByte/CloudSteps'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: admin/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: admin
        run: pnpm install --frozen-lockfile

      - name: 构建（项目页子路径 + demo 模式）
        working-directory: admin
        env:
          # 仓库名作为 GitHub Pages 项目页子路径
          VITE_BASE_PATH: "/${{ github.event.repository.name }}/"
          # demo 模式：跳过登录校验，直接放行看 UI
          VITE_DEMO_MODE: "1"
        run: pnpm run build

      - name: SPA 路由回退（history 模式在 GitHub Pages 刷新深层路径会 404）
        working-directory: admin
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin/dist

  deploy:
    if: github.repository != 'LingByte/CloudSteps'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
