<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>更换邮箱验证</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .content { background: #fff; padding: 24px; border: 1px solid #e9ecef; border-radius: 8px; }
        .button { display: inline-block; background: #007bff; color: white; padding: 12px 24px; text-decoration: none; border-radius: 4px; }
    </style>
</head>
<body>
<div class="container">
    <div class="content">
        <p>亲爱的 {{.Username}}，</p>
        <p>您正在将账号邮箱更换为 <strong>{{.NewEmail}}</strong>，请点击下方按钮确认：</p>
        <p><a href="{{.VerifyURL}}" class="button">确认更换邮箱</a></p>
        <p style="word-break: break-all;">{{.VerifyURL}}</p>
    </div>
</div>
</body>
</html>
