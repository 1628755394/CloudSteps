<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>登录提醒</title>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .content { background: #fff; padding: 24px; border: 1px solid #e9ecef; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="content">
        <p>亲爱的 {{.Username}}，</p>
        <p>您的账号于 {{.LoginTime}} 成功登录。</p>
        <p>IP：{{.IPAddress}}</p>
        <p>如非本人操作，请立即修改密码并检查账号安全。</p>
    </div>
</div>
</body>
</html>
